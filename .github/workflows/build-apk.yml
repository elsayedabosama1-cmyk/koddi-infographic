name: Build APK
on:
  push:
    paths-ignore: ['data/**','photos/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tagammu-gharbia-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tagammu-gharbia.apk
          gh release delete tagammu-apk --yes --cleanup-tag || true
          gh release create tagammu-apk tagammu-gharbia.apk --target "$GITHUB_SHA" --title "تطبيق التجمع – الغربية (APK)" --notes "نزّل tagammu-gharbia.apk وثبّته على الموبايل."
